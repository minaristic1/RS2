<div class="login-container d-flex justify-content-center">
  <div class="card" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h2 class="mb-1">Prijava</h2>
      <p class="text-muted small mb-3">Prijavi se da naručiš omiljenu hranu pravo na tvoju adresu.</p>

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" [(ngModel)]="form.email" name="email" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Lozinka</label>
          <input class="form-control" type="password" [(ngModel)]="form.password" name="password" required />
        </div>

        @if (error()) {
          <div class="alert alert-danger">Pogrešan email ili lozinka.</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="saving()">
          {{ saving() ? 'Prijavljivanje...' : 'Prijavi se' }}
        </button>

        <p class="mt-3 small text-center mb-0">
          Nemaš nalog? <a routerLink="/register">Registruj se</a>
        </p>
      </form>
    </div>
  </div>
</div>
