<div class="restaurant-create-container">
  <a routerLink="/restaurants" class="btn btn-outline-secondary btn-sm mb-3">&larr; Nazad na restorane</a>

  <h2 class="mb-3">{{ editId ? 'Izmeni restoran' : 'Dodaj restoran' }}</h2>

  @if (loading()) {
    <p>Učitavanje...</p>
  }

  <form (ngSubmit)="submit()" style="max-width: 480px;">
    <div class="mb-3">
      <label class="form-label">Naziv (srpski)</label>
      <input class="form-control" [(ngModel)]="form.nameSr" name="nameSr" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Naziv (engleski)</label>
      <input class="form-control" [(ngModel)]="form.nameEn" name="nameEn" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Opis (srpski)</label>
      <textarea class="form-control" [(ngModel)]="form.descriptionSr" name="descriptionSr" rows="2"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Opis (engleski)</label>
      <textarea class="form-control" [(ngModel)]="form.descriptionEn" name="descriptionEn" rows="2"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Adresa</label>
      <input class="form-control" [(ngModel)]="form.address" name="address" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Slika (URL)</label>
      <input class="form-control" [(ngModel)]="form.imageUrl" name="imageUrl" placeholder="https://..." />
    </div>

    <div class="mb-3">
      <label class="form-label">Tip kuhinje</label>
      <select class="form-select" [(ngModel)]="form.cuisineType" name="cuisineType">
        @for (type of cuisineTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" [(ngModel)]="form.isFeatured" name="isFeatured" id="isFeatured" />
      <label class="form-check-label" for="isFeatured">Izdvojen restoran</label>
    </div>

    @if (error()) {
      <div class="alert alert-danger">Došlo je do greške prilikom čuvanja. Proveri podatke i pokušaj ponovo.</div>
    }

    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Čuvanje...' : (editId ? 'Sačuvaj izmene' : 'Sačuvaj restoran') }}
    </button>
  </form>
</div>
